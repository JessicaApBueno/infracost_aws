name: Infracost
on:
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Caixinha 1: Autenticação AWS
  Auth-AWS:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

  # Caixinha 2: Setup das Ferramentas
  Setup-Tools:
    needs: Auth-AWS
    runs-on: ubuntu-latest
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}

  # Caixinha 3: Análise de Custos
  Generate-Cost:
    needs: Setup-Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
      - name: Generate Infracost JSON
        run: infracost breakdown --path . --format json --out-file /tmp/infracost.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      # Upload do arquivo para a próxima caixinha usar
      - name: Archive Infracost JSON
        uses: actions/upload-artifact@v4
        with:
          name: infracost-json
          path: /tmp/infracost.json

  # Caixinha 4: Postar Comentário
  Post-Comment:
    needs: Generate-Cost
    runs-on: ubuntu-latest
    steps:
      - name: Download Infracost JSON
        uses: actions/download-artifact@v4
        with:
          name: infracost-json
          path: /tmp
      - name: Post Infracost comment
        run: |
          infracost comment github --path /tmp/infracost.json \
                                   --repo $GITHUB_REPOSITORY \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --github-token ${{ secrets.GITHUB_TOKEN }} \
                                   --behavior update
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}