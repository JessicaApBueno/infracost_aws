name: Infracost
on:
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  Setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}

  Generate-Diff:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout da branch principal para saber o preço antigo
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}

      # 2. Gera o custo da main (Baseline)
      - name: Generate Baseline JSON
        run: infracost breakdown --path . --format json --out-file /tmp/infracost-base.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      # 3. Volta para o código do seu PR
      - name: Checkout PR branch
        uses: actions/checkout@v4

      # 4. Faz a comparação (Diff)
      - name: Generate Diff JSON
        run: |
          infracost diff --path . \
                         --format json \
                         --compare-to /tmp/infracost-base.json \
                         --out-file /tmp/infracost-diff.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Archive Diff JSON
        uses: actions/upload-artifact@v4
        with:
          name: infracost-diff
          path: /tmp/infracost-diff.json

  Post-Comment:
    needs: Generate-Diff
    runs-on: ubuntu-latest
    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Download Diff JSON
        uses: actions/download-artifact@v4
        with:
          name: infracost-diff
          path: /tmp

      - name: Post Infracost comment
        run: |
          infracost comment github --path /tmp/infracost-diff.json \
                                   --repo $GITHUB_REPOSITORY \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --github-token ${{ secrets.GITHUB_TOKEN }} \
                                   --behavior update
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}